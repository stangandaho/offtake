url: https://stangandaho.github.io/offtake/

template:
  bootstrap: 5
  light-switch: yes
  bslib:
    base_font:
      google: Montserrat
    heading_font:
      google: Montserrat
    code_font:
      google: JetBrains Mono
  math-rendering: mathjax

navbar:
  structure:
    left: [reference, articles, news]
    right: [search, github]

articles:
- title: Articles
  navbar: ~
  contents:
  - index-based
  - model-based

reference:
- title: Index-based approaches
  desc: Compare a harvest or abundance metric between hunted and reference sites.
  contents:
  - ot_asc
  - ot_hyco
  - ot_pdc
- title: Model-based approaches
  desc: Compare observed offtake with an estimated maximum sustainable harvest.
  contents:
  - ot_pro
  - ot_pbr
  - ot_msy
  - ot_samse
  - ot_biode
  - ot_biode_surface
  - ot_biode_cpue
- title: Helpers
  contents:
  - ot_lambda_max
- title: Datasets
  contents:
  - bushmeat_sites
  - bushmeat_ages
  - duiker_demography
  - manu_settlements
